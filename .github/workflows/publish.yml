name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish to Hex
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.18.4"
          otp-version: "28.5"

      - name: Install dependencies
        run: mix deps.get

      - name: Check the tag matches the version in mix.exs
        run: |
          version=$(mix run --no-start --no-compile -e 'IO.puts(Mix.Project.config()[:version])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in mix.exs"
            exit 1
          fi

      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
